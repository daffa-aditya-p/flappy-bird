<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Modern Flappy Bird - Professional Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #gameCanvas {
            border: 3px solid rgb(88, 101, 242);
            box-shadow: 0 0 40px rgba(88, 101, 242, 0.5);
            max-width: 95vw;
            max-height: 95vh;
            cursor: pointer;
            border-radius: 10px;
            display: block;
        }
        
        @media (max-width: 768px) {
            #gameCanvas {
                border-width: 2px;
                max-width: 100vw;
                max-height: 100vh;
                border-radius: 0;
            }
        }
        
        /* Name Input Overlay for Mobile */
        #nameInputOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
        }
        
        #nameInputOverlay.active {
            display: flex;
        }
        
        #nameInputOverlay h2 {
            color: #FFD700;
            font-size: 32px;
            text-align: center;
            margin-bottom: 10px;
        }
        
        #nameInputOverlay .score-display {
            color: #FF6B6B;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        #nameInputField {
            width: 300px;
            max-width: 80vw;
            padding: 15px 20px;
            font-size: 24px;
            border: 3px solid #4ECDC4;
            border-radius: 10px;
            background: white;
            text-align: center;
            outline: none;
        }
        
        #nameInputField:focus {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        
        .overlay-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .overlay-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .overlay-btn:active {
            transform: scale(0.95);
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #4ECDC4, #2ECC71);
            color: white;
        }
        
        .btn-cancel {
            background: linear-gradient(135deg, #FF6B6B, #ee5a5a);
            color: white;
        }
        
        .overlay-hint {
            color: #7F8C8D;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    
    <!-- Name Input Overlay for Mobile Support -->
    <div id="nameInputOverlay">
        <h2>🎉 NEW HIGH SCORE!</h2>
        <div class="score-display" id="overlayScore">Score: 0</div>
        <p style="color: white; font-size: 18px;">Masukkan nama kamu:</p>
        <input type="text" id="nameInputField" placeholder="Nama kamu..." maxlength="20" autocomplete="off">
        <div class="overlay-buttons">
            <button class="overlay-btn btn-submit" id="submitNameBtn">✓ SUBMIT</button>
            <button class="overlay-btn btn-cancel" id="cancelNameBtn">✕ CANCEL</button>
        </div>
        <p class="overlay-hint">Tekan Enter untuk submit</p>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
